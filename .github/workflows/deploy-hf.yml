name: Deploy backend to Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

concurrency:
  group: deploy-hf
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Push backend/ to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_USERNAME" ] || [ -z "$HF_SPACE" ]; then
            echo "::notice::Секреты HF_* не заданы: автодеплой пропущен (загружайте файлы в Space вручную)."
            exit 0
          fi
          rm -rf /tmp/space && mkdir /tmp/space
          cp -r backend/. /tmp/space/
          find /tmp/space -name '__pycache__' -type d -prune -exec rm -rf {} +
          cd /tmp/space
          git init -q -b main
          git config user.email "actions@users.noreply.github.com"
          git config user.name "GitHub Actions"
          git add -A
          git commit -q -m "Deploy from GitHub ${GITHUB_SHA}"
          git push --force "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE}" main
          echo "Готово: Space пересобирается (Space -> вкладка Logs)."
